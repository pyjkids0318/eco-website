<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>에코 라이프</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

<nav id="menu"></nav>

<h1>🌱 에코 라이프</h1>

<section class="box">
<h2>추천</h2>
<div id="recommendations"></div>
</section>

<section class="box">
<h2>탄소 절감량</h2>
<span id="total-carbon">0</span> kg
</section>

</div>

<script>

const username = localStorage.getItem("username");

const menu = document.getElementById("menu");

if (username) {
  menu.innerHTML = `
    <span>${username}</span> |
    <a href="/record.html">기록</a> |
    <a href="#" id="logout">로그아웃</a>
  `;
} else {
  menu.innerHTML = `
    <a href="/login.html">로그인</a> |
    <a href="/signup.html">회원가입</a>
  `;
}

document.addEventListener("click", (e) => {
  if (e.target.id === "logout") {
    localStorage.removeItem("username");
    location.reload();
  }
});

fetch("/api/recommendations")
.then(r => r.json())
.then(data => {
  document.getElementById("recommendations").innerHTML =
    data.map(i => `
      <div>✅ ${i.action_name} (${i.carbon_saved}kg)</div>
    `).join("");
});

fetch("/api/total-carbon")
.then(r => r.json())
.then(data => {
  document.getElementById("total-carbon").innerText = data.total;
});

</script>

</body>
</html>
