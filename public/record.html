<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기록</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

<h1>행동 기록</h1>

<div id="list"></div>

</div>

<script>

const username = localStorage.getItem("username");

fetch("/api/actions")
.then(r => r.json())
.then(data => {
  document.getElementById("list").innerHTML =
    data.map(a => `
      <div>
        ${a.action_name}
        <button onclick="save(${a.id})">기록</button>
      </div>
    `).join("");
});

async function save(actionId) {
  await fetch("/api/record", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ actionId, username })
  });

  alert("저장 완료");
}

</script>

</body>
</html>
