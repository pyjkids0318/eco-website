<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>행동 기록</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🌱 행동 기록</h1>

<div id="actions">로딩중...</div>

</div>

<script>

const username = localStorage.getItem("username");

fetch("/api/actions")
.then(res => res.json())
.then(data => {

  const container = document.getElementById("actions");

  container.innerHTML = data.map(item => `
    <div class="box">
      <strong>${item.action_name}</strong>
      <div>🌿 ${item.carbon_saved} kg 절감</div>

      <button onclick="record(${item.id})">
        기록하기
      </button>
    </div>
  `).join("");

});

async function record(actionId) {

  const username = localStorage.getItem("username");

  if (!username) {
    alert("로그인 필요");
    return;
  }

  await fetch("/api/record", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      actionId,
      username
    })
  });

  alert("기록 완료!");

}

</script>

</body>
</html>
