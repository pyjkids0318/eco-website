<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 에코 라이프</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav><a href="/">홈으로</a></nav>
        <h1>📝 회원가입</h1>
        <form action="/api/signup" method="POST" class="box">
            <input type="email" name="email" placeholder="이메일 등록" required><br>
            <input type="text" name="username" placeholder="아이디 입력" required><br>
            <input type="password" name="password" placeholder="비밀번호 입력" required><br>
            <button type="submit">가입하기</button>
        </form>
    </div>
</body>
</html>
